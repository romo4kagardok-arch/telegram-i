name: Создать ключ подписи (один раз)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Генерируем ключ
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_PASSWORD" ] || { echo "::error::Нет секрета KEYSTORE_PASSWORD"; exit 1; }
          keytool -genkeypair -storetype PKCS12 -keystore release.keystore -alias telegrami \
            -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=telegram i"
          keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" | grep -i telegrami

      # The keystore is encrypted with KEYSTORE_PASSWORD; the artifact lives one day
      # and is deleted right after it is copied into the KEYSTORE_B64 secret.
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: release.keystore
          retention-days: 1
